<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 3b: "The Crosshair T" - Heavy version -->
  <!-- Letter "T" with bold targeting lines -->
  
  <!-- Horizontal crosshair line (thick) -->
  <rect x="8" y="20" width="48" height="3" fill="currentColor"/>
  
  <!-- Vertical crosshair line (T's stem, thick) -->
  <rect x="30.5" y="8" width="3" height="48" fill="currentColor"/>
  
  <!-- Top horizontal bar of T (very thick) -->
  <rect x="10" y="14" width="44" height="10" fill="currentColor"/>
  
  <!-- Corner brackets (larger, more prominent) -->
  <rect x="6" y="6" width="8" height="3" fill="currentColor"/>
  <rect x="6" y="6" width="3" height="8" fill="currentColor"/>
  
  <rect x="50" y="6" width="8" height="3" fill="currentColor"/>
  <rect x="55" y="6" width="3" height="8" fill="currentColor"/>
  
  <rect x="6" y="55" width="8" height="3" fill="currentColor"/>
  <rect x="6" y="50" width="3" height="8" fill="currentColor"/>
  
  <rect x="50" y="55" width="8" height="3" fill="currentColor"/>
  <rect x="55" y="50" width="3" height="8" fill="currentColor"/>
</svg>
