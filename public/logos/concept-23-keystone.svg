<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 23: "Keystone" - Architecture/Structure -->
  <!-- Arch with highlighted keystone at top -->
  <!-- Suggests: the critical piece that holds everything together, the key insight -->
  
  <!-- Left pillar -->
  <rect x="10" y="24" width="8" height="32" fill="currentColor"/>
  
  <!-- Right pillar -->
  <rect x="46" y="24" width="8" height="32" fill="currentColor"/>
  
  <!-- Arch segments (approximated with stepped rects) -->
  <rect x="10" y="18" width="8" height="6" fill="currentColor"/>
  <rect x="18" y="14" width="8" height="4" fill="currentColor"/>
  <rect x="38" y="14" width="8" height="4" fill="currentColor"/>
  <rect x="46" y="18" width="8" height="6" fill="currentColor"/>
  
  <!-- Keystone (the critical piece, highlighted) -->
  <rect x="26" y="8" width="12" height="12" fill="currentColor"/>
  
  <!-- Keystone inner mark -->
  <rect x="30" y="12" width="4" height="4" fill="currentColor" opacity="0.3"/>
</svg>
