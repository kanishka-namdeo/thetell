<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 3: "The Crosshair T" - Letterform + Metaphor -->
  <!-- Letter "T" formed by intersecting targeting lines -->
  <!-- Suggests: precision, focus, detection -->
  
  <!-- Horizontal crosshair line -->
  <rect x="8" y="20" width="48" height="2" fill="currentColor"/>
  
  <!-- Vertical crosshair line (T's stem) -->
  <rect x="31" y="8" width="2" height="48" fill="currentColor"/>
  
  <!-- Top horizontal bar of T (thicker, more prominent) -->
  <rect x="12" y="16" width="40" height="8" fill="currentColor"/>
  
  <!-- Corner markers (targeting reticle details) -->
  <rect x="8" y="8" width="6" height="2" fill="currentColor"/>
  <rect x="8" y="8" width="2" height="6" fill="currentColor"/>
  
  <rect x="50" y="8" width="6" height="2" fill="currentColor"/>
  <rect x="54" y="8" width="2" height="6" fill="currentColor"/>
  
  <rect x="8" y="54" width="6" height="2" fill="currentColor"/>
  <rect x="8" y="50" width="2" height="6" fill="currentColor"/>
  
  <rect x="50" y="54" width="6" height="2" fill="currentColor"/>
  <rect x="54" y="50" width="2" height="6" fill="currentColor"/>
</svg>
