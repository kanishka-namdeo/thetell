<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 6b: "Cipher" - Multiple segments -->
  <!-- Concentric squares with multiple offset segments -->
  
  <!-- Outer square -->
  <rect x="8" y="8" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Middle square -->
  <rect x="16" y="16" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Inner square, solid -->
  <rect x="24" y="24" width="16" height="16" fill="currentColor"/>
  
  <!-- Multiple offset segments (more complex cipher pattern) -->
  <rect x="8" y="20" width="6" height="3" fill="currentColor"/>
  <rect x="8" y="41" width="6" height="3" fill="currentColor"/>
  <rect x="50" y="20" width="6" height="3" fill="currentColor"/>
  <rect x="50" y="41" width="6" height="3" fill="currentColor"/>
  <rect x="20" y="8" width="3" height="6" fill="currentColor"/>
  <rect x="41" y="8" width="3" height="6" fill="currentColor"/>
  <rect x="20" y="50" width="3" height="6" fill="currentColor"/>
  <rect x="41" y="50" width="3" height="6" fill="currentColor"/>
</svg>
