<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Concept 13f: Different bar thicknesses (asymmetric weight) -->
  <!-- Top horizontal bar (thin) -->
  <rect x="2" y="2" width="20" height="2" fill="currentColor"/>
  <!-- Right vertical bar (thick) -->
  <rect x="18" y="2" width="4" height="20" fill="currentColor"/>
  <!-- Bottom horizontal bar (thick) -->
  <rect x="2" y="20" width="20" height="2" fill="currentColor"/>
  <!-- Left vertical bar (thin, shorter) -->
  <rect x="2" y="2" width="2" height="11" fill="currentColor"/>
</svg>
