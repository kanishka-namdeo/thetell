<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 1b: "The Redacted" - Thin bars -->
  <!-- Horizontal bars with gaps forming a "T" - thinner version -->
  
  <!-- Top bar -->
  <rect x="8" y="14" width="48" height="4" fill="currentColor"/>
  
  <!-- Middle bar with gap forming T's vertical -->
  <rect x="8" y="28" width="20" height="4" fill="currentColor"/>
  <rect x="36" y="28" width="20" height="4" fill="currentColor"/>
  
  <!-- Bottom bar -->
  <rect x="8" y="42" width="48" height="4" fill="currentColor"/>
  
  <!-- Additional subtle bar -->
  <rect x="8" y="50" width="48" height="2" fill="currentColor" opacity="0.4"/>
  
  <!-- The negative space between middle bars forms a vertical line -->
</svg>
