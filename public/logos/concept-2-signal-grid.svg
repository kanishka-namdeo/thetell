<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 2: "Signal Grid" - Abstract Geometric -->
  <!-- Grid of squares, some filled, some empty -->
  <!-- Pattern suggests data/signals being detected -->
  
  <!-- Row 1 -->
  <rect x="8" y="8" width="10" height="10" fill="currentColor"/>
  <rect x="20" y="8" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="32" y="8" width="10" height="10" fill="currentColor"/>
  <rect x="44" y="8" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Row 2 -->
  <rect x="8" y="20" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="20" y="20" width="10" height="10" fill="currentColor"/>
  <rect x="32" y="20" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="44" y="20" width="10" height="10" fill="currentColor"/>
  
  <!-- Row 3 -->
  <rect x="8" y="32" width="10" height="10" fill="currentColor"/>
  <rect x="20" y="32" width="10" height="10" fill="currentColor"/>
  <rect x="32" y="32" width="10" height="10" fill="currentColor"/>
  <rect x="44" y="32" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  
  <!-- Row 4 -->
  <rect x="8" y="44" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="20" y="44" width="10" height="10" fill="currentColor"/>
  <rect x="32" y="44" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="44" y="44" width="10" height="10" fill="currentColor"/>
</svg>
