<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Concept 13c: Broken frame with gaps at corners -->
  <!-- Top horizontal bar (shorter, doesn't reach corners) -->
  <rect x="4" y="2" width="16" height="2.5" fill="currentColor"/>
  <!-- Right vertical bar (shorter, gap at top and bottom) -->
  <rect x="19.5" y="5" width="2.5" height="14" fill="currentColor"/>
  <!-- Bottom horizontal bar (shorter, doesn't reach corners) -->
  <rect x="4" y="19.5" width="16" height="2.5" fill="currentColor"/>
  <!-- Left vertical bar (shorter, partial height with gaps) -->
  <rect x="2" y="5" width="2.5" height="9" fill="currentColor"/>
</svg>
