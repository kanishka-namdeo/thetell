<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Concept 13g: Nested inner frame (smaller, offset) -->
  <!-- Outer frame (original) -->
  <rect x="2" y="2" width="20" height="2.5" fill="currentColor"/>
  <rect x="19.5" y="2" width="2.5" height="20" fill="currentColor"/>
  <rect x="2" y="19.5" width="20" height="2.5" fill="currentColor"/>
  <rect x="2" y="2" width="2.5" height="12" fill="currentColor"/>
  <!-- Inner frame (smaller, offset) -->
  <rect x="7" y="7" width="10" height="1.5" fill="currentColor" opacity="0.6"/>
  <rect x="15.5" y="7" width="1.5" height="10" fill="currentColor" opacity="0.6"/>
  <rect x="7" y="15.5" width="10" height="1.5" fill="currentColor" opacity="0.6"/>
  <rect x="7" y="7" width="1.5" height="6" fill="currentColor" opacity="0.6"/>
</svg>
