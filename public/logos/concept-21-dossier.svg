<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 21: "Dossier" - Intelligence File -->
  <!-- Tabbed file folder with classified marking -->
  <!-- Suggests: intelligence files, classified information, investigation -->
  
  <!-- Folder body -->
  <rect x="8" y="16" width="48" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Folder tab -->
  <rect x="8" y="8" width="16" height="8" fill="currentColor"/>
  
  <!-- Internal document lines -->
  <rect x="14" y="24" width="36" height="2" fill="currentColor" opacity="0.3"/>
  <rect x="14" y="30" width="36" height="2" fill="currentColor" opacity="0.3"/>
  <rect x="14" y="36" width="24" height="2" fill="currentColor" opacity="0.3"/>
  <rect x="14" y="42" width="36" height="2" fill="currentColor" opacity="0.3"/>
  
  <!-- Redacted bar over content -->
  <rect x="14" y="36" width="24" height="4" fill="currentColor"/>
  
  <!-- Classification stamp (top right) -->
  <rect x="36" y="46" width="16" height="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="38" y="48" width="12" height="2" fill="currentColor"/>
</svg>
