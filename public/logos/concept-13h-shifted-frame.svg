<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Concept 13h: Shifted/misaligned bars -->
  <!-- Top horizontal bar (shifted right) -->
  <rect x="4" y="2" width="18" height="2.5" fill="currentColor"/>
  <!-- Right vertical bar (shifted down) -->
  <rect x="19.5" y="6" width="2.5" height="16" fill="currentColor"/>
  <!-- Bottom horizontal bar (shifted left) -->
  <rect x="2" y="19.5" width="18" height="2.5" fill="currentColor"/>
  <!-- Left vertical bar (shifted up, shorter) -->
  <rect x="2" y="4" width="2.5" height="10" fill="currentColor"/>
</svg>
