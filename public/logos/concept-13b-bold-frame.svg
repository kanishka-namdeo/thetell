<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Concept 13b: Bold, thick bars -->
  <!-- Top horizontal bar -->
  <rect x="1" y="1" width="22" height="4" fill="currentColor"/>
  <!-- Right vertical bar (taller, full height) -->
  <rect x="19" y="1" width="4" height="22" fill="currentColor"/>
  <!-- Bottom horizontal bar -->
  <rect x="1" y="19" width="22" height="4" fill="currentColor"/>
  <!-- Left vertical bar (shorter, partial height) -->
  <rect x="1" y="1" width="4" height="13" fill="currentColor"/>
</svg>
