<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 22: "Prism" - Refraction/Analysis -->
  <!-- Triangle splitting a beam into multiple lines -->
  <!-- Suggests: analysis, breaking down signals, revealing hidden components -->
  
  <!-- Input beam (single line entering) -->
  <rect x="4" y="30" width="20" height="4" fill="currentColor"/>
  
  <!-- Prism (triangle approximated) -->
  <rect x="24" y="16" width="16" height="32" fill="currentColor"/>
  <!-- Triangle top -->
  <rect x="28" y="12" width="8" height="4" fill="currentColor"/>
  <!-- Triangle bottom -->
  <rect x="28" y="48" width="8" height="4" fill="currentColor"/>
  
  <!-- Output beams (split into multiple lines) -->
  <rect x="40" y="18" width="20" height="2" fill="currentColor"/>
  <rect x="40" y="26" width="20" height="2" fill="currentColor"/>
  <rect x="40" y="34" width="20" height="2" fill="currentColor"/>
  <rect x="40" y="42" width="20" height="2" fill="currentColor"/>
</svg>
