<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 6: "Cipher" - Abstract Geometric -->
  <!-- Concentric squares with offset segments -->
  <!-- Suggests: encryption, code-breaking, layers -->
  
  <!-- Outer square -->
  <rect x="8" y="8" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Middle square, rotated/offset -->
  <rect x="16" y="16" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Inner square, solid -->
  <rect x="24" y="24" width="16" height="16" fill="currentColor"/>
  
  <!-- Offset segments suggesting cipher alignment -->
  <rect x="8" y="30" width="8" height="4" fill="currentColor"/>
  <rect x="48" y="30" width="8" height="4" fill="currentColor"/>
  <rect x="30" y="8" width="4" height="8" fill="currentColor"/>
  <rect x="30" y="48" width="4" height="8" fill="currentColor"/>
</svg>
