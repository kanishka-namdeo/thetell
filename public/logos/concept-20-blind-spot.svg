<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Concept 20: "Blind Spot" - Vision/Surveillance -->
  <!-- Concentric rectangles with a gap/void -->
  <!-- Suggests: what's hidden in plain sight, the unseen signal -->
  
  <!-- Outer ring -->
  <rect x="4" y="4" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Middle ring -->
  <rect x="12" y="12" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Inner ring -->
  <rect x="20" y="20" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"/>
  
  <!-- Center void (the blind spot) -->
  <rect x="28" y="28" width="8" height="8" fill="currentColor" opacity="0.15"/>
  
  <!-- Gap in the rings (blind spot opening) -->
  <!-- Cut a gap in the inner ring on the right side -->
  <rect x="42" y="28" width="4" height="8" fill="currentColor"/>
  
  <!-- Alignment mark pointing to the void -->
  <rect x="44" y="31" width="16" height="2" fill="currentColor"/>
</svg>
