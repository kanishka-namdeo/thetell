services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: thell_user
      POSTGRES_PASSWORD: thell_password
      POSTGRES_DB: the_tell
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  inngest:
    image: inngest/inngest
    restart: always
    command: "inngest dev -u http://host.docker.internal:3000/api/inngest"
    ports:
      - "8288:8288"
      - "8289:8289"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloakbrowser:
    image: cloakhq/cloakbrowser
    command: cloakserve
    restart: unless-stopped
    ports:
      - "127.0.0.1:9222:9222"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222/json/version"]
      interval: 30s
      timeout: 5s
      retries: 3

  rsshub:
    image: diygod/rsshub:chromium-bundled
    restart: always
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: "300"
      CACHE_CONTENT_EXPIRE: "3600"
      REQUEST_TIMEOUT: "30000"
      # Twitter credentials (optional, enables /twitter/* routes)
      # TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:1200:1200"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  jina-reader:
    image: ghcr.io/jina-ai/reader:oss
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
